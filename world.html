<!doctype html>
<!-- 目的 — ワールドモードの独立入口（file://対応） — doc/20261004-concept-world-mode.md §2.8・§5 -->
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>World — Audio Visual Analyzer</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#eee;font:14px system-ui,sans-serif}
body{display:grid;place-items:center}canvas{display:block;position:absolute;object-fit:contain;top:0}
#prompt{position:relative;border:0;background:none;color:inherit;font:inherit;letter-spacing:.12em;cursor:pointer;padding:2rem}
#prompt[hidden],#debug[hidden]{display:none}#prompt.busy{color:#aeefff}
#controls{position:fixed;inset:auto 0 0;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px;background:#111;border-top:1px solid #333;z-index:2}
#controls button,.file-button{border:1px solid #555;border-radius:6px;background:#222;color:#eee;padding:10px 14px;font:inherit;cursor:pointer}
#controls [hidden]{display:none}#export-progress{width:100px}#fps,#type{background:#222;color:#eee;padding:8px}
#controls button:disabled{opacity:.45;cursor:default}#file{position:absolute;width:1px;height:1px;opacity:0}
.file-button:focus-within,button:focus-visible,input:focus-visible{outline:2px solid #8ed9fa;outline-offset:3px}
#seek{flex:1;min-width:100px;accent-color:#8ed9fa}#time{font-variant-numeric:tabular-nums;font-size:12px}
#debug{position:absolute;top:12px;left:12px;white-space:pre;pointer-events:none;font:11px ui-monospace,monospace;color:#cce1ef;background:#0009;padding:9px;max-height:70vh;overflow:hidden}
</style>
</head>
<body>
<canvas id="world" width="1920" height="1080" aria-label="曲に合わせて変わる世界"></canvas>
<button id="prompt" type="button">曲をドロップ</button><pre id="debug" hidden></pre>
<nav id="controls" aria-label="再生操作">
<label class="file-button">曲を読み込む<input id="file" type="file" accept="audio/*,video/*"></label>
<label>TYPE <select id="type" aria-label="GPUアナライザー（1〜6）"></select></label>
<button id="play" type="button" disabled>再生</button>
<input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="再生位置" disabled>
<output id="time">0:00 / 0:00</output>
<button id="fullscreen" type="button" aria-label="全画面切替（F）" aria-pressed="false">全画面 (F)</button>
<label>FPS <select id="fps" aria-label="描画・書き出しFPS"><option value="30">30</option><option value="60" selected>60</option></select></label>
<button id="export" type="button" disabled>EXPORT / 書き出し</button>
<button id="cancel-export" type="button" hidden>中止</button>
<progress id="export-progress" max="1" value="0" hidden aria-label="書き出し進捗"></progress>
<output id="export-status" role="status" aria-live="polite"></output>
</nav>
<audio id="audio" preload="auto" hidden></audio>
<script src="js/vis-utils.js"></script>
<script src="js/fft.js"></script><script src="js/mfs-const.js"></script><script src="js/mfs-dsp.js"></script>
<script src="js/mfs-onset.js"></script><script src="js/mfs-tempo.js"></script><script src="js/mfs-extractor.js"></script>
<script src="js/mfs-worklet.js"></script><script src="js/mfs-view.js"></script>
<script src="js/songmap-analysis.js"></script><script src="js/songmap-service.js"></script><script src="js/audio-engine.js"></script>
<script src="js/world/gl-util.js"></script><script src="js/world/fluid.js"></script><script src="js/world/particles.js"></script>
<script src="js/world/post.js"></script><script src="js/world/score.js"></script>
<script src="js/webm-muxer.js"></script><script src="js/mp4-muxer.js"></script>
<script src="js/offline-exporter.js"></script>
<script src="js/world/analyzer-types.js"></script><script src="js/world/g-fluid.js"></script>
<script src="js/world/g-rings.js"></script><script src="js/world/g-galaxy.js"></script>
<script src="js/world/world-engine.js"></script><script src="js/world/world-exporter.js"></script><script src="js/world/world-app.js"></script>
</body>
</html>
